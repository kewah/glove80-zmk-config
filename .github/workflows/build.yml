name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Glove80 keymap
        run: python3 tests/verify_keymap.py

  build:
    needs: verify
    # Use the reusable builder from the same pinned MoErgo distribution.
    uses: moergo-sc/zmk/.github/workflows/build-user-config.yml@4b2f3b9b718a4508e87111cdec24cda16f3c2726
